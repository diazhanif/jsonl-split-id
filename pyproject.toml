[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jsonl-split-id"
version = "0.1.0"
description = "Split reproducible JSONL dataset untuk eksperimen AI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jsonl-split-id contributors" }]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
jsonl-split-id = "jsonl_split_id.core:main"

[tool.setuptools.packages.find]
where = ["src"]
